# craftctl global defaults.
# Installed to /etc/craftctl/craftctl.conf (never overwritten on update).
# https://github.com/ferranox/craftctl

# Default Minecraft version when --version is omitted.
# Empty means "latest stable PaperMC version" (resolved via Fill API).
DEFAULT_VERSION=

# Default heap size for new servers.
DEFAULT_MEMORY=2G

# First server port to try; increments until a free port is found.
DEFAULT_PORT=25565

# Number of backups to retain per server (used by --backup/--restore/--update-server).
BACKUP_RETENTION=7

# Optional override directory containing java binaries (e.g. /opt/java).
# Empty = auto-detect per-server Java.
JAVA_DIR=
