name: Feature request
description: Suggest an improvement to craftctl
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should craftctl do instead? Include example commands.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Server lifecycle
        - PaperMC / Java
        - Whitelist / RCON
        - Backup / restore
        - Install / update / uninstall
        - Docs / UX
        - Other
